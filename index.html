<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 회화 동화로 표현하기 프로젝트(수행평가)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f3f4f6; }
        .japanese-font { font-family: 'Zen Maru Gothic', sans-serif; }
        .flip-card { perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ⚠️ 구글 앱스 스크립트 배포 웹 앱 URL을 여기에 붙여넣으세요.
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwvtqNgQOHNCqMXhnX8L_FOQyoIDKJJ6ubrjX0XZV5-ftzaPRVK_d784gkPyUBc2XIjRA/exec";

        const CLASS_OPTIONS = ['A8반', 'B7반', 'C6반', 'E1반'];

        const wordsData = [
            { ko: "만들다", jp: "つくる [츠쿠루]" },
            { ko: "무엇, 뭐", jp: "なに [나니]" },
            { ko: "~(으)로 (수단, 재료)", jp: "で [데]" },
            { ko: "~은, 는", jp: "は [와]" },
            { ko: "~이, 가", jp: "が [가]" },
            { ko: "흙", jp: "つち [츠치]" },
            { ko: "뱀", jp: "へび [헤비]" },
            { ko: "항아리", jp: "つぼ [츠보]" },
            { ko: "술", jp: "さけ [사케]" },
            { ko: "친구", jp: "ともだち [토모다치]" }
        ];

        const standardSentences = [
            { ko: "흙으로 무엇을 만들어? / 항아리 만들어.", jp: "つちで なに つくる？ / つぼ つくる。" },
            { ko: "종이로 무엇을 만들어? / 종이학 만들어.", jp: "かみで なに つくる？ / おりづる つくる。" },
            { ko: "나무로 무엇을 만들어? / 의자 만들어.", jp: "きで なに つくる？ / いす つくる。" },
            { ko: "천으로 무엇을 만들어? / 옷 만들어.", jp: "ぬので なに つくる？ / ふく つくる。" }
        ];

        function HomeScreen({ setScreen, refreshData, isLoading }) {
            return (
                <div className="flex flex-col items-center justify-center py-8 px-4">
                    <div className="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mb-6 shadow-sm">
                        <i className="fa-solid fa-book-open text-5xl text-indigo-600"></i>
                    </div>
                    <h1 className="text-3xl font-black text-gray-800 mb-2 text-center">일본어 회화 수행평가</h1>
                    <p className="text-gray-500 mb-8 font-medium">동화로 표현하기 & 실시간 음성 채점</p>

                    <div className="w-full max-w-md flex flex-col gap-3">
                        <button onClick={() => setScreen('practice')} className="py-4 px-4 text-lg font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 shadow-md">
                            <i className="fa-solid fa-headphones mr-2"></i> 단어 및 문장 연습
                        </button>
                        <button onClick={() => setScreen('student-submit')} className="py-4 px-4 text-lg font-bold rounded-xl text-indigo-700 bg-indigo-100 hover:bg-indigo-200">
                            <i className="fa-solid fa-pen mr-2"></i> 동화책 제출하기
                        </button>
                        <button onClick={() => { refreshData(); setScreen('student-result'); }} className="py-4 px-4 text-lg font-bold rounded-xl text-indigo-600 border border-indigo-200 bg-white hover:bg-gray-50">
                            <i className="fa-solid fa-chart-bar mr-2"></i> 내 평가 결과 및 녹음 확인
                        </button>
                        <div className="border-t border-gray-200 my-2"></div>
                        <button onClick={() => { refreshData(); setScreen('teacher-login'); }} className="py-4 px-4 text-lg font-bold rounded-xl text-white bg-gray-800 hover:bg-gray-900">
                            <i className="fa-solid fa-chalkboard-user mr-2"></i> 교사 채점 및 제출 현황 관리
                        </button>
                    </div>
                </div>
            );
        }

        function PracticeScreen({ setScreen }) {
            const [mode, setMode] = useState('words');
            const [flippedState, setFlippedState] = useState({});

            const toggleFlip = (idx) => {
                setFlippedState({ ...flippedState, [idx]: !flippedState[idx] });
            };

            const getList = () => mode === 'words' ? wordsData : standardSentences;

            return (
                <div className="flex flex-col h-full">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => setScreen('home')} className="text-gray-600 font-bold"><i className="fa-solid fa-arrow-left"></i> 홈으로</button>
                        <h2 className="text-xl font-bold">연습 모드</h2>
                        <div></div>
                    </div>

                    <div className="flex bg-gray-200 rounded-lg p-1 mb-6">
                        <button onClick={() => setMode('words')} className={`flex-1 py-2 font-bold rounded-md ${mode === 'words' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>단어 연습</button>
                        <button onClick={() => setMode('sentences')} className={`flex-1 py-2 font-bold rounded-md ${mode === 'sentences' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>기본 문장</button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto max-h-[60vh] p-1">
                        {getList().map((item, idx) => (
                            <div key={idx} className={`flip-card h-36 ${flippedState[idx] ? 'flipped' : ''}`} onClick={() => toggleFlip(idx)}>
                                <div className="flip-card-inner shadow rounded-xl border bg-white">
                                    <div className="flip-card-front flex items-center justify-center p-4 font-bold text-gray-800">
                                        {item.ko}
                                    </div>
                                    <div className="flip-card-back flex items-center justify-center p-4 font-bold text-indigo-600 japanese-font text-lg bg-indigo-50 rounded-xl">
                                        {item.jp}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function StudentSubmitScreen({ setScreen, refreshData }) {
            const [studentClass, setStudentClass] = useState('a1반');
            const [studentId, setStudentId] = useState('');
            const [studentName, setStudentName] = useState('');
            const [sentences, setSentences] = useState([{ ko: '' }, { ko: '' }, { ko: '' }, { ko: '' }]);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!studentId || !studentName) return alert("학번과 이름을 입력해주세요.");
                for (let s of sentences) {
                    if (!s.ko.trim()) return alert("4개 문장을 모두 입력해주세요.");
                }

                setIsSubmitting(true);
                const payload = {
                    action: 'submitStory',
                    data: { studentClass, studentId, studentName, sentences }
                };

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    alert("구글 시트로 정상 제출되었습니다!");
                    refreshData();
                    setScreen('home');
                } catch (err) {
                    alert("제출 중 오류 발생: " + err.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-lg mx-auto py-4">
                    <h2 className="text-2xl font-bold mb-6 text-center">동화책 제출하기</h2>
                    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="text-xs font-bold text-gray-600">반 선택</label>
                                <select value={studentClass} onChange={e => setStudentClass(e.target.value)} className="w-full border rounded-lg p-2.5 font-bold">
                                    {CLASS_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-600">학번</label>
                                <input type="text" placeholder="10101" value={studentId} onChange={e => setStudentId(e.target.value)} className="w-full border rounded-lg p-2.5 font-bold" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-600">이름</label>
                                <input type="text" placeholder="홍길동" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full border rounded-lg p-2.5 font-bold" />
                            </div>
                        </div>

                        <div className="flex flex-col gap-3 mt-2">
                            <label className="text-sm font-bold text-gray-700">창작 동화 문장 4개 (한국어)</label>
                            {sentences.map((s, idx) => (
                                <input key={idx} type="text" placeholder={`문장 ${idx + 1}`} value={s.ko} 
                                    onChange={e => {
                                        const newS = [...sentences];
                                        newS[idx].ko = e.target.value;
                                        setSentences(newS);
                                    }} 
                                    className="border rounded-lg p-2.5 text-sm"
                                />
                            ))}
                        </div>

                        <div className="flex gap-2 mt-4">
                            <button type="button" onClick={() => setScreen('home')} className="flex-1 bg-gray-200 py-3 rounded-xl font-bold">취소</button>
                            <button type="submit" disabled={isSubmitting} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">
                                {isSubmitting ? '제출 중...' : '구글 시트로 제출'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function TeacherLoginScreen({ setScreen }) {
            const [pw, setPw] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                if (pw === '1207') setScreen('teacher-dashboard');
                else alert('비밀번호가 틀렸습니다.');
            };

            return (
                <div className="max-w-xs mx-auto py-12 text-center">
                    <h2 className="text-2xl font-black mb-6">교사 전용 로그인</h2>
                    <form onSubmit={handleLogin} className="flex flex-col gap-3">
                        <input type="password" placeholder="비밀번호 입력" value={pw} onChange={e => setPw(e.target.value)} className="border p-3 rounded-xl text-center font-bold" />
                        <button type="submit" className="bg-gray-800 text-white font-bold py-3 rounded-xl">접속하기</button>
                    </form>
                </div>
            );
        }

        function TeacherDashboardScreen({ setScreen, studentData, testScores, setSelectedStudent, setTestQuestions }) {
            const [selectedClass, setSelectedClass] = useState('a1반');
            const [activeTab, setActiveTab] = useState('status');

            const submittedKeys = Object.keys(studentData);
            const classSubmitted = submittedKeys.filter(key => key.startsWith(selectedClass));

            const startTest = (studentKey) => {
                setSelectedStudent(studentKey);
                const storyQ = (studentData[studentKey] || []).map(s => ({ type: '창작', ko: s.ko, jp: '자유 회화 표현' }));
                const stdQ = standardSentences.map(q => ({ type: '기본', ko: q.ko, jp: q.jp }));
                setTestQuestions([...stdQ, ...storyQ]);
                setScreen('test-run');
            };

            return (
                <div className="max-w-2xl mx-auto py-4">
                    <div className="flex justify-between items-center mb-4">
                        <button onClick={() => setScreen('home')} className="text-gray-600 font-bold"><i className="fa-solid fa-arrow-left"></i> 홈으로</button>
                        <h2 className="text-xl font-bold">교사 관리 대시보드</h2>
                        <div></div>
                    </div>

                    <div className="flex bg-gray-200 rounded-lg p-1 mb-4">
                        <button onClick={() => setActiveTab('status')} className={`flex-1 py-2 font-bold rounded-md ${activeTab === 'status' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>제출 & 평가 진행</button>
                        <button onClick={() => setActiveTab('results')} className={`flex-1 py-2 font-bold rounded-md ${activeTab === 'results' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>채점 결과 & 녹음 확인</button>
                    </div>

                    <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
                        {CLASS_OPTIONS.map(c => (
                            <button key={c} onClick={() => setSelectedClass(c)} className={`px-4 py-1.5 rounded-full font-bold text-sm ${selectedClass === c ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                                {c}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'status' ? (
                        <div className="bg-white rounded-xl border divide-y">
                            {classSubmitted.length > 0 ? classSubmitted.map((stKey, idx) => {
                                const isEvaluated = !!testScores[stKey];
                                return (
                                    <div key={idx} className="p-4 flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-gray-800">{stKey}</p>
                                            <span className={`text-xs px-2 py-0.5 rounded font-bold ${isEvaluated ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                {isEvaluated ? `채점완료 (${testScores[stKey].score}점)` : '채점 대기중'}
                                            </span>
                                        </div>
                                        <button onClick={() => startTest(stKey)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm">
                                            {isEvaluated ? '재평가' : '평가 시작'}
                                        </button>
                                    </div>
                                );
                            }) : (
                                <p className="p-8 text-center text-gray-400 font-bold">{selectedClass} 제출 학생이 없습니다.</p>
                            )}
                        </div>
                    ) : (
                        <div className="flex flex-col gap-4">
                            {Object.keys(testScores).filter(k => k.startsWith(selectedClass)).map((stKey, idx) => {
                                const res = testScores[stKey];
                                return (
                                    <div key={idx} className="bg-white p-4 rounded-xl border">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="font-bold text-lg">{stKey}</h3>
                                            <span className="text-xl font-black text-indigo-600">{res.score} / {res.details ? res.details.length : 0} 점</span>
                                        </div>
                                        <div className="space-y-2 border-t pt-2">
                                            {(res.details || []).map((item, qIdx) => (
                                                <div key={qIdx} className={`p-2.5 rounded-lg text-xs font-bold ${item.isCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                                                    <div className="flex justify-between">
                                                        <span>문항 {qIdx+1}. {item.ko}</span>
                                                        <span>{item.isCorrect ? 'O 정답' : 'X 오답'}</span>
                                                    </div>
                                                    {item.audioDataUrl && (
                                                        <audio controls src={item.audioDataUrl} className="w-full mt-2 h-7" />
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function TestRunScreen({ setScreen, testQuestions, studentName, refreshData }) {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const [testDetails, setTestDetails] = useState([]);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const current = testQuestions[idx];

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioUrl(URL.createObjectURL(audioBlob));
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => setAudioBase64(reader.result);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    alert("마이크 권한이 필요합니다.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleMark = async (isCorrect) => {
                const currentRecord = {
                    ko: current.ko,
                    jp: current.jp,
                    isCorrect: isCorrect,
                    audioDataUrl: audioBase64
                };
                const updatedDetails = [...testDetails, currentRecord];
                setTestDetails(updatedDetails);

                const nextScore = isCorrect ? score + 1 : score;
                setScore(nextScore);

                // 초기화
                setAudioUrl(null);
                setAudioBase64(null);
                setShowAnswer(false);

                if (idx < testQuestions.length - 1) {
                    setIdx(idx + 1);
                } else {
                    // 최종 저장
                    const payload = {
                        action: 'saveScore',
                        data: { studentName, score: nextScore, details: updatedDetails }
                    };

                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert(`채점 완료! 구글 시트에 저장되었습니다. (최종 점수: ${nextScore}점)`);
                    } catch(e) {
                        alert("구글 시트 저장 중 에러가 발생했습니다.");
                    }
                    refreshData();
                    setScreen('teacher-dashboard');
                }
            };

            return (
                <div className="max-w-lg mx-auto py-6 text-center">
                    <div className="flex justify-between items-center mb-4">
                        <span className="font-bold text-gray-600">{studentName} 평가 중</span>
                        <span className="font-bold text-indigo-600">{idx + 1} / {testQuestions.length}</span>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border shadow-sm mb-6">
                        <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded">{current.type} 문항</span>
                        <p className="text-2xl font-black text-gray-800 my-6">{current.ko}</p>

                        <button onClick={() => setShowAnswer(!showAnswer)} className="text-xs text-indigo-600 font-bold underline mb-2">
                            {showAnswer ? '정답 숨기기' : '🔒 교사용 정답 확인'}
                        </button>
                        {showAnswer && <p className="text-indigo-600 font-bold japanese-font text-lg">{current.jp}</p>}
                    </div>

                    {/* 녹음 컨트롤 */}
                    <div className="bg-indigo-50 p-4 rounded-xl border mb-6 flex flex-col items-center gap-3">
                        <p className="text-xs font-bold text-indigo-800">학생 발음 녹음</p>
                        <div className="flex gap-2">
                            {!isRecording ? (
                                <button onClick={startRecording} className="bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
                                    <i className="fa-solid fa-microphone mr-1"></i> 녹음 시작
                                </button>
                            ) : (
                                <button onClick={stopRecording} className="bg-gray-800 text-white font-bold px-4 py-2 rounded-lg text-sm animate-pulse">
                                    <i className="fa-solid fa-stop mr-1"></i> 녹음 중단
                                </button>
                            )}
                        </div>
                        {audioUrl && <audio controls src={audioUrl} className="w-full mt-2 h-8" />}
                    </div>

                    {/* O X 채점 */}
                    <div className="flex gap-4">
                        <button onClick={() => handleMark(false)} className="flex-1 bg-red-500 text-white font-bold py-5 rounded-xl text-2xl">X (오답)</button>
                        <button onClick={() => handleMark(true)} className="flex-1 bg-green-500 text-white font-bold py-5 rounded-xl text-2xl">O (정답)</button>
                    </div>
                </div>
            );
        }

        function StudentResultScreen({ setScreen, testScores }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [result, setResult] = useState(null);
            const [searched, setSearched] = useState(false);

            const handleSearch = (e) => {
                e.preventDefault();
                setSearched(true);
                const key = Object.keys(testScores).find(k => k.includes(searchQuery.trim()));
                setResult(key ? { name: key, ...testScores[key] } : null);
            };

            return (
                <div className="max-w-md mx-auto py-6">
                    <button onClick={() => setScreen('home')} className="text-gray-600 font-bold mb-4"><i className="fa-solid fa-arrow-left"></i> 홈으로</button>
                    <h2 className="text-2xl font-bold mb-6 text-center">내 결과 & 녹음 확인</h2>

                    <form onSubmit={handleSearch} className="flex gap-2 mb-6">
                        <input type="text" placeholder="이름 또는 학번 입력" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-1 border p-3 rounded-xl font-bold" />
                        <button type="submit" className="bg-indigo-600 text-white font-bold px-5 rounded-xl">조회</button>
                    </form>

                    {searched && (
                        result ? (
                            <div className="bg-white p-6 rounded-xl border shadow-sm">
                                <h3 className="font-bold text-center text-gray-700">{result.name}</h3>
                                <p className="text-4xl font-black text-center text-indigo-600 my-4">{result.score} 점</p>
                                <div className="space-y-3 border-t pt-4">
                                    {(result.details || []).map((d, i) => (
                                        <div key={i} className="text-xs p-3 rounded-lg border bg-gray-50">
                                            <p className="font-bold mb-1">{i+1}. {d.ko}</p>
                                            <span className={d.isCorrect ? 'text-green-600 font-bold' : 'text-red-500 font-bold'}>{d.isCorrect ? '정답' : '오답'}</span>
                                            {d.audioDataUrl && <audio controls src={d.audioDataUrl} className="w-full mt-2 h-7" />}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <p className="text-center font-bold text-red-500 my-8">채점 결과가 존재하지 않습니다.</p>
                        )
                    )}
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('home');
            const [studentData, setStudentData] = useState({});
            const [testScores, setTestScores] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState('');
            const [testQuestions, setTestQuestions] = useState([]);

            const refreshData = async () => {
                if (!GAS_URL || GAS_URL.includes("여기에")) return;
                setIsLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?action=getData`);
                    const data = await res.json();
                    if (data.studentData) setStudentData(data.studentData);
                    if (data.testScores) setTestScores(data.testScores);
                } catch (e) {
                    console.log("동기화 실패", e);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { refreshData(); }, []);

            return (
                <div className="min-h-screen bg-gray-100 py-6 px-4 flex justify-center">
                    <div className="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 border min-h-[85vh]">
                        {screen === 'home' && <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />}
                        {screen === 'practice' && <PracticeScreen setScreen={setScreen} />}
                        {screen === 'student-submit' && <StudentSubmitScreen setScreen={setScreen} refreshData={refreshData} />}
                        {screen === 'student-result' && <StudentResultScreen setScreen={setScreen} testScores={testScores} />}
                        {screen === 'teacher-login' && <TeacherLoginScreen setScreen={setScreen} />}
                        {screen === 'teacher-dashboard' && <TeacherDashboardScreen setScreen={setScreen} studentData={studentData} testScores={testScores} setSelectedStudent={setSelectedStudent} setTestQuestions={setTestQuestions} />}
                        {screen === 'test-run' && <TestRunScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} refreshData={refreshData} />}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
