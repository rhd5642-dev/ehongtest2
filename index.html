        function TestRunScreen({ setScreen, testQuestions, studentName, refreshData }) {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const [testDetails, setTestDetails] = useState([]);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const current = testQuestions[idx];

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioUrl(URL.createObjectURL(audioBlob));
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => setAudioBase64(reader.result);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    alert("마이크 권한이 필요합니다.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleMark = async (isCorrect) => {
                const currentRecord = {
                    ko: current.ko,
                    jp: current.jp,
                    isCorrect: isCorrect,
                    audioDataUrl: audioBase64
                };
                const updatedDetails = [...testDetails, currentRecord];
                setTestDetails(updatedDetails);

                const nextScore = isCorrect ? score + 1 : score;
                setScore(nextScore);

                setAudioUrl(null);
                setAudioBase64(null);
                setShowAnswer(false);

                if (idx < testQuestions.length - 1) {
                    setIdx(idx + 1);
                } else {
                    const payload = {
                        action: 'saveScore',
                        data: { studentName, score: nextScore, details: updatedDetails }
                    };

                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert(`채점 완료! 구글 시트에 저장되었습니다. (최종 점수: ${nextScore}점)`);
                    } catch(e) {
                        alert("구글 시트 저장 중 에러가 발생했습니다.");
                    }
                    refreshData();
                    setScreen('teacher-dashboard');
                }
            };

            return (
                <div className="max-w-lg mx-auto py-6 text-center">
                    <div className="flex justify-between items-center mb-4">
                        <span className="font-bold text-gray-600">{studentName} 평가 중</span>
                        <span className="font-bold text-indigo-600">{idx + 1} / {testQuestions.length}</span>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border shadow-sm mb-6">
                        <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded">{current.type} 문항</span>
                        <p className="text-2xl font-black text-gray-800 my-6 whitespace-pre-line text-left bg-gray-50 p-4 rounded-xl">{current.ko}</p>

                        <button onClick={() => setShowAnswer(!showAnswer)} className="text-xs text-indigo-600 font-bold underline mb-2">
                            {showAnswer ? '정답 숨기기' : '🔒 교사용 정답 확인'}
                        </button>
                        {showAnswer && <p className="text-indigo-600 font-bold japanese-font text-lg whitespace-pre-line text-left bg-indigo-50 p-4 rounded-xl border border-indigo-100">{current.jp}</p>}
                    </div>

                    <div className="bg-indigo-50 p-4 rounded-xl border mb-6 flex flex-col items-center gap-3">
                        <p className="text-xs font-bold text-indigo-800">학생 발음 녹음</p>
                        <div className="flex gap-2">
                            {!isRecording ? (
                                <button onClick={startRecording} className="bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
                                    <i className="fa-solid fa-microphone mr-1"></i> 녹음 시작
                                </button>
                            ) : (
                                <button onClick={stopRecording} className="bg-gray-800 text-white font-bold px-4 py-2 rounded-lg text-sm animate-pulse">
                                    <i className="fa-solid fa-stop mr-1"></i> 녹음 중단
                                </button>
                            )}
                        </div>
                        {audioUrl && <audio controls src={audioUrl} className="w-full mt-2 h-8" />}
                    </div>

                    <div className="flex gap-4">
                        <button onClick={() => handleMark(false)} className="flex-1 bg-red-500 text-white font-bold py-5 rounded-xl text-2xl">X (오답)</button>
                        <button onClick={() => handleMark(true)} className="flex-1 bg-green-500 text-white font-bold py-5 rounded-xl text-2xl">O (정답)</button>
                    </div>
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('home');
            const [studentData, setStudentData] = useState({});
            const [testScores, setTestScores] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState('');
            const [testQuestions, setTestQuestions] = useState([]);

            const refreshData = async () => {
                if (!GAS_URL || GAS_URL.includes("여기에")) return;
                setIsLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?action=getData`);
                    const data = await res.json();
                    if (data.studentData) setStudentData(data.studentData);
                    if (data.testScores) setTestScores(data.testScores);
                } catch (e) {
                    console.log("동기화 실패", e);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { refreshData(); }, []);

            return (
                <div className="min-h-screen bg-gray-100 py-6 px-4 flex justify-center">
                    <div className="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 border min-h-[85vh]">
                        {screen === 'home' && <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />}
                        {screen === 'practice' && <PracticeScreen setScreen={setScreen} />}
                        {screen === 'student-submit' && <StudentSubmitScreen setScreen={setScreen} refreshData={refreshData} />}
                        {screen === 'student-result' && <StudentResultScreen setScreen={setScreen} testScores={testScores} />}
                        {screen === 'teacher-login' && <TeacherLoginScreen setScreen={setScreen} />}
                        {screen === 'teacher-dashboard' && <TeacherDashboardScreen setScreen={setScreen} studentData={studentData} testScores={testScores} setSelectedStudent={setSelectedStudent} setTestQuestions={setTestQuestions} />}
                        {screen === 'test-run' && <TestRunScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} refreshData={refreshData} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
