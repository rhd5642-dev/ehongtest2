        const speakJapanese = (text) => {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel(); 

            const cleanText = text.replace(/\[[^\]]*\]/g, '').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        };

        // 손글씨 피드백 작성용 캔버스 컴포넌트
        function HandwritingCanvas({ value, onChange }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [penColor, setPenColor] = useState('#dc2626'); // 기본 빨간색
            const [isEmpty, setIsEmpty] = useState(!value);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                if (value) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = value;
                    setIsEmpty(false);
                }
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.strokeStyle = penColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                setIsDrawing(true);
                setIsEmpty(false);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                if (canvas && onChange) {
                    onChange(canvas.toDataURL());
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setIsEmpty(true);
                if (onChange) onChange(null);
            };

            return (
                <div className="flex flex-col gap-1 w-full my-3">
                    <div className="flex justify-between items-center text-xs font-bold text-gray-700 mb-1">
                        <span className="flex items-center gap-1.5 text-indigo-900 font-extrabold">

                            <div className="flex gap-1 items-center bg-gray-100 p-1 rounded-lg border">
                                {['#dc2626', '#2563eb', '#111827'].map(color => (
                                    <button
                                        key={color}
                                        type="button"
                                        onClick={() => setPenColor(color)}
                                        style={{ backgroundColor: color }}
                                        className={`w-5 h-5 rounded-full border-2 transition-all ${penColor === color ? 'border-amber-400 scale-110 shadow' : 'border-white'}`}
                                    />
                                ))}
                            </div>
                            <button
                                type="button"
                                onClick={clearCanvas}
                                className="px-2.5 py-1 text-[11px] bg-gray-200 hover:bg-gray-300 rounded-lg font-bold text-gray-700 flex items-center gap-1 transition-all"
                            >
                                <i className="fa-solid fa-eraser"></i> 지우기
                            </button>
                        </div>
                    </div>
                    
                    <div className="relative border-2 border-indigo-200 rounded-xl bg-white overflow-hidden shadow-inner touch-none">
                        {isEmpty && (
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-gray-300 text-xs font-bold select-none">
                                ✍️ 여백에 터치나 마우스로 손글씨 피드백을 작성하세요
                            </div>
                        )}
                        <canvas
                            ref={canvasRef}
                            width={600}
                            height={140}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            className="w-full h-28 cursor-crosshair block"
                        />
                    </div>
                </div>
            );

        function TeacherDashboardScreen({ setScreen, studentData, testScores, setSelectedStudent, setTestQuestions }) {
            const [selectedClass, setSelectedClass] = useState('a8반');
            const [activeTab, setActiveTab] = useState('status');
            const [searchTerm, setSearchTerm] = useState('');

            const sortedSubmittedKeys = Object.keys(studentData).sort((a, b) => 
                a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );

            const classSubmitted = sortedSubmittedKeys.filter(key => 
                key.startsWith(selectedClass) &&
                (searchTerm.trim() === '' || key.toLowerCase().includes(searchTerm.toLowerCase().trim()))
            );

            const sortedEvaluatedKeys = Object.keys(testScores)
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }))
                .filter(key => 
                    key.startsWith(selectedClass) &&
                    (searchTerm.trim() === '' || key.toLowerCase().includes(searchTerm.toLowerCase().trim()))
                );

            const generateQuestions = (studentKey) => {
                let seed = 0;
                for (let i = 0; i < studentKey.length; i++) {
                    seed = studentKey.charCodeAt(i) + ((seed << 5) - seed);
                }
                
                const seededRandom = () => {
                    const x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                };

                const shuffledStd = [...standardSentences]
                    .map(item => ({ item, sortVal: seededRandom() }))
                    .sort((a, b) => a.sortVal - b.sortVal)
                    .map(obj => obj.item);

                const selectedStd = shuffledStd.slice(0, 4).map((q, idx) => ({
                    type: `기본 동화 문장 ${idx + 1}`,
                    q_ko: q.q_ko,
                    a_ko: q.a_ko,
                    q_jp: q.q_jp,
                    a_jp: q.a_jp,
                    ko: `질문: ${q.q_ko}\n답변: ${q.a_ko}`,
                    jp: `[질문] ${q.q_jp}\n[답변] ${q.a_jp}`
                }));

                const storyQ = (studentData[studentKey] || []).slice(0, 4).map((s, idx) => ({
                    type: `창작 동화 문장 ${idx + 1}`,
                    ko: s.ko,
                    jp: '학생 제출 문장에 맞춘 회화 표현'
                }));

                return [...selectedStd, ...storyQ];
            };

            const startTest = (studentKey) => {
                setSelectedStudent(studentKey);
                const qList = generateQuestions(studentKey);
                setTestQuestions(qList);
                setScreen('test-run');
            };

            const openStudentDisplay = (studentKey) => {
                setSelectedStudent(studentKey);
                const qList = generateQuestions(studentKey);
                setTestQuestions(qList);
                setScreen('student-display');
            };

            return (
                <div className="max-w-2xl mx-auto py-4">
                    <div className="flex justify-between items-center mb-4">

                        <button onClick={() => setActiveTab('status')} className={`flex-1 py-2 font-bold rounded-md ${activeTab === 'status' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>제출 & 평가 진행</button>

                    </div>

                    <div className="flex gap-2 mb-3 overflow-x-auto pb-1">
                        {CLASS_OPTIONS.map(c => (
                            <button key={c} onClick={() => setSelectedClass(c)} className={`px-4 py-1.5 rounded-full font-bold text-sm ${selectedClass === c ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                                {c}
                            </button>

                    </div>

                    <div className="relative mb-4">
                        <input 
                            type="text" 
                            placeholder="학번 또는 이름 검색..." 
                            value={searchTerm} 
                            onChange={(e) => setSearchTerm(e.target.value)}

                                <i className="fa-solid fa-xmark"></i>

                                                    item.markType === 'partial' ? 'bg-yellow-50 border-yellow-200 text-yellow-900' :

                                                        <div className="mt-2 pt-2 border-t border-red-200 text-red-600 flex items-center gap-1.5 flex-wrap">
                                                            <span className="bg-red-200 text-red-800 px-1.5 py-0.5 rounded text-[10px] font-black">틀린 단어</span>
                                                            {item.wrongWords.map((w, wI) => (
                                                                <span key={wI} className="bg-red-100 text-red-700 px-1.5 py-0.5 rounded line-through">{w}</span>
                                                            ))}
                                                        </div>
                                                    )}

                                                    {item.audioDataUrl && (
                                                        <div className="mt-2 pt-2 border-t border-gray-200">
                                                            <p className="text-[11px] text-indigo-700 font-bold mb-1 flex items-center gap-1">
                                                                <i className="fa-solid fa-microphone text-indigo-500"></i> 녹음된 학생 발음 재생:
                                                            </p>
                                                            <audio controls src={item.audioDataUrl} className="w-full h-8 rounded" />
                                                        </div>
                                                    )}

                                                    {item.handwritingFeedback && (
                                                        <div className="mt-2 pt-2 border-t border-indigo-100">
                                                            <p className="text-[11px] text-indigo-800 font-bold mb-1 flex items-center gap-1">
                                                                <i className="fa-solid fa-pen-nib text-indigo-600"></i> 교사 손글씨 피드백:
                                                            </p>
                                                            <img src={item.handwritingFeedback} alt="손글씨 피드백" className="max-h-28 border border-indigo-200 rounded-lg bg-white p-1" />
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            }) : (
                                <p className="p-8 text-center text-gray-400 font-bold bg-white rounded-xl border">채점 결과가 없습니다.</p>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function StudentDisplayScreen({ setScreen, testQuestions, studentName }) {
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(20);

            useEffect(() => {
                const handleMessage = (event) => {
                    if (event.data && event.data.type === 'CHANGE_QUESTION_INDEX') {
                        setIdx(event.data.index);
                    }
                };
                syncChannel.addEventListener('message', handleMessage);
                return () => syncChannel.removeEventListener('message', handleMessage);
            }, []);

            useEffect(() => {
                setTimeLeft(20);
            }, [idx]);

            useEffect(() => {
                if (timeLeft <= 0) {
                    if (idx < testQuestions.length - 1) {
                        const nextIdx = idx + 1;
                        setIdx(nextIdx);
                        syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: nextIdx });
                    }
                    return;
                }

                const timer = setInterval(() => {
                    setTimeLeft(prev => prev - 1);
                }, 1000);

                return () => clearInterval(timer);
            }, [timeLeft, idx, testQuestions.length]);

            const current = testQuestions[idx];

            if (!current) {
                return (
                    <div className="py-12 text-center font-bold text-gray-500">
                        질문을 불러오는 중입니다...
                        <div className="mt-4">
                            <button onClick={() => setScreen('teacher-dashboard')} className="bg-gray-200 px-4 py-2 rounded-lg text-sm">대시보드로 돌아가기</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto py-6 flex flex-col justify-between min-h-[75vh]">
                    <div className="flex justify-between items-center border-b pb-4 mb-4">
                        <button onClick={() => setScreen('teacher-dashboard')} className="text-gray-500 font-bold text-sm">
                            <i className="fa-solid fa-arrow-left mr-1"></i> 대시보드
                        </button>
                        <span className="font-extrabold text-teal-700 text-lg">{studentName} 질문 제시 화면</span>
                        <div className="flex items-center gap-2">
                            <span className={`px-4 py-1.5 rounded-full font-black flex items-center gap-1.5 transition-all border ${
                                timeLeft <= 5 ? 'bg-red-500 text-white border-red-600 animate-pulse' : 'bg-amber-100 text-amber-900 border-amber-300'
                            }`}>
                                <i className="fa-solid fa-stopwatch text-xl"></i>
                                <span className="text-3xl font-black leading-none">{timeLeft}</span>
                                <span className="text-xs font-bold">초</span>
                            </span>
                            <span className="bg-teal-100 text-teal-800 font-black text-sm px-3 py-1 rounded-full">
                                셋트 {idx + 1} / {testQuestions.length}
                            </span>
                        </div>
                    </div>

                    <div className="my-auto py-12 px-6 bg-teal-50/60 rounded-3xl border-2 border-teal-100 text-center shadow-sm">
                        <span className="text-xs font-bold bg-white text-teal-700 px-3 py-1 rounded-full border border-teal-200">
                            {current.type}
                        </span>
                        
                        <div className="mt-8 text-2xl sm:text-3xl font-black text-gray-800 leading-relaxed whitespace-pre-line">
                            {current.ko}
                        </div>
                    </div>

                    <div className="flex justify-between items-center gap-4 pt-6 border-t mt-4">
                        <button 
                            disabled={idx === 0} 
                            onClick={() => {
                                const newIdx = idx - 1;
                                setIdx(newIdx);
                                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: newIdx });
                            }} 
                            className="flex-1 bg-gray-200 hover:bg-gray-300 disabled:opacity-30 text-gray-800 font-bold py-4 rounded-xl text-lg transition-all flex items-center justify-center gap-2"
                        >
                            <i className="fa-solid fa-chevron-left"></i> 이전 문제
                        </button>
                        <button 
                            disabled={idx === testQuestions.length - 1} 
                            onClick={() => {
                                const newIdx = idx + 1;
                                setIdx(newIdx);
                                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: newIdx });
                            }} 
                            className="flex-1 bg-teal-600 hover:bg-teal-700 disabled:opacity-30 text-white font-bold py-4 rounded-xl text-lg shadow-md transition-all flex items-center justify-center gap-2"
                        >
                            다음 문제 <i className="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            );
        }

        // 모든 문제를 한 화면에서 채점하고 손글씨 피드백을 작성하는 채점 화면
        function TestRunScreen({ setScreen, testQuestions, studentName, refreshData }) {
            const [marks, setMarks] = useState(() => testQuestions.map(() => 'correct'));
            const [wrongWordsPerQ, setWrongWordsPerQ] = useState(() => testQuestions.map(() => []));
            const [recordingsPerQ, setRecordingsPerQ] = useState(() => testQuestions.map(() => ({ audioUrl: null, audioBase64: null })));
            const [feedbackPerQ, setFeedbackPerQ] = useState(() => testQuestions.map(() => null));
            const [showAnswerPerQ, setShowAnswerPerQ] = useState(() => testQuestions.map(() => false));
            const [recordingQIdx, setRecordingQIdx] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // 실시간 총점 계산 (정답 1점, 부분오답 0.5점, 오답 0점)
            const totalScore = marks.reduce((acc, m) => acc + (m === 'correct' ? 1 : m === 'partial' ? 0.5 : 0), 0);

            const setMarkForQ = (qIdx, markType) => {
                const nextMarks = [...marks];
                nextMarks[qIdx] = markType;
                setMarks(nextMarks);
            };

            const toggleWordForQ = (qIdx, wordIdx) => {
                const currentList = wrongWordsPerQ[qIdx] || [];
                const nextList = currentList.includes(wordIdx)
                    ? currentList.filter(i => i !== wordIdx)
                    : [...currentList, wordIdx];
                const nextState = [...wrongWordsPerQ];
                nextState[qIdx] = nextList;
                setWrongWordsPerQ(nextState);
            };

            const toggleAnswerForQ = (qIdx) => {
                const nextState = [...showAnswerPerQ];
                nextState[qIdx] = !nextState[qIdx];
                setShowAnswerPerQ(nextState);
            };

            const handleFeedbackChange = (qIdx, dataUrl) => {
                const nextState = [...feedbackPerQ];
                nextState[qIdx] = dataUrl;
                setFeedbackPerQ(nextState);
            };

            const syncQuestionToStudent = (qIdx) => {
                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: qIdx });
                const element = document.getElementById(`question-card-${qIdx}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const startRecording = async (qIdx) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let mimeType = 'audio/webm;codecs=opus';
                    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

                    mediaRecorderRef.current = new MediaRecorder(stream, { mimeType });
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
                        const url = URL.createObjectURL(audioBlob);
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const nextRecordings = [...recordingsPerQ];
                            nextRecordings[qIdx] = { audioUrl: url, audioBase64: reader.result };
                            setRecordingsPerQ(nextRecordings);
                        };
                    };

                    mediaRecorderRef.current.start();
                    setRecordingQIdx(qIdx);
                } catch (err) {
                    alert("마이크 권한이 필요합니다.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && recordingQIdx !== null) {
                    mediaRecorderRef.current.stop();
                    setRecordingQIdx(null);
                }
            };

            const handleSaveAll = async () => {
                if (isSaving) return;
                setIsSaving(true);

                const details = testQuestions.map((q, qIdx) => {
                    const words = splitTextWithParticles(q.ko);
                    const wrongIndices = wrongWordsPerQ[qIdx] || [];
                    const markedWrongWords = wrongIndices.map(i => words[i]);
                    const markType = marks[qIdx] || 'correct';
                    return {
                        ko: q.ko,
                        jp: q.jp,
                        isCorrect: markType === 'correct',
                        markType: markType,
                        wrongWords: markedWrongWords,
                        audioDataUrl: recordingsPerQ[qIdx]?.audioBase64 || null,
                        handwritingFeedback: feedbackPerQ[qIdx] || null
                    };
                });

                const payload = {
                    action: 'saveScore',
                    data: { studentName, score: totalScore, details }
                };

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    alert(`전체 평가 완료!\n${studentName} 학생의 점수 (${totalScore} / ${testQuestions.length}점) 및 손글씨 피드백이 성공적으로 저장되었습니다.`);
                } catch (e) {
                    alert("구글 시트 저장 중 에러가 발생했습니다.");
                }
                refreshData();
                setIsSaving(false);
                setScreen('teacher-dashboard');
            };

            return (
                <div className="max-w-2xl mx-auto py-2">
                    {/* 상단 핀 고정 대시보드 헤더 */}
                    <div className="sticky top-0 bg-white/95 backdrop-blur z-20 pb-3 border-b mb-6 shadow-sm">
                        <div className="flex justify-between items-center mb-3 pt-2">
                            <button onClick={() => setScreen('teacher-dashboard')} className="text-gray-600 font-bold text-sm hover:text-gray-900">
                                <i className="fa-solid fa-arrow-left mr-1"></i> 대시보드
                            </button>
                            <span className="font-extrabold text-indigo-900 text-lg">{studentName} 전체 문항 채점</span>
                            <div className="flex items-center gap-2">
                                <span className="bg-indigo-100 text-indigo-900 font-black text-lg px-3.5 py-1 rounded-full border border-indigo-200">
                                    {totalScore} / {testQuestions.length} 점
                                </span>
                            </div>
                        </div>

                        {/* 문제 빠른 이동 및 채점 현황 바 */}
                        <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                            {testQuestions.map((q, qIdx) => {
                                const m = marks[qIdx];
                                const colorClass = m === 'correct' ? 'bg-green-600 text-white' : m === 'partial' ? 'bg-amber-500 text-white' : 'bg-red-500 text-white';
                                return (
                                    <button
                                        key={qIdx}
                                        onClick={() => syncQuestionToStudent(qIdx)}
                                        className={`px-2.5 py-1 text-xs font-bold rounded-lg shrink-0 flex items-center gap-1 transition-all ${colorClass}`}
                                    >
                                        <span>셋트 {qIdx + 1}</span>
                                        <span className="text-[10px] opacity-90">{m === 'correct' ? 'O' : m === 'partial' ? '△' : 'X'}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* 전체 8개 문제 카드가 한 화면에 일렬로 나열됨 */}
                    <div className="space-y-6">
                        {testQuestions.map((current, qIdx) => {
                            const wordList = splitTextWithParticles(current.ko);
                            const wrongIndices = wrongWordsPerQ[qIdx] || [];
                            const currentMark = marks[qIdx];

                            return (
                                <div key={qIdx} id={`question-card-${qIdx}`} className="bg-white p-5 rounded-2xl border-2 border-gray-200 shadow-sm transition-all hover:border-indigo-200">
                                    <div className="flex justify-between items-center mb-3 border-b pb-2">
                                        <div className="flex items-center gap-2">
                                            <span className="bg-indigo-600 text-white font-black text-xs px-2.5 py-1 rounded-md">셋트 {qIdx + 1}</span>
                                            <span className="text-xs font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full border border-indigo-100">{current.type}</span>
                                        </div>
                                        <button
                                            onClick={() => syncQuestionToStudent(qIdx)}
                                            className="bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-bold text-xs px-2.5 py-1 rounded-lg flex items-center gap-1 transition-all"
                                        >
                                            <i className="fa-solid fa-mobile-screen"></i> 학생 태블릿 동기화
                                        </button>
                                    </div>

                                    {/* 문장 및 틀린 단어 원터치 선택 */}
                                    <div className="mb-3">
                                        <p className="text-[11px] text-gray-400 font-bold mb-1.5 text-left">
                                            💡 발음이나 표현이 틀린 단어를 클릭하면 취소선이 그어집니다.
                                        </p>
                                        <div className="flex flex-wrap gap-1.5 p-3 rounded-xl bg-gray-50 border leading-relaxed">
                                            {wordList.map((word, wIdx) => {
                                                const isWrong = wrongIndices.includes(wIdx);
                                                return (
                                                    <button
                                                        key={wIdx}
                                                        type="button"
                                                        onClick={() => toggleWordForQ(qIdx, wIdx)}
                                                        className={`px-2.5 py-1 rounded-lg font-bold text-sm border transition-all ${
                                                            isWrong
                                                                ? 'bg-red-500 text-white border-red-600 line-through shadow-inner'
                                                                : 'bg-white text-gray-800 border-gray-300 hover:bg-gray-100 shadow-sm'
                                                        }`}
                                                    >
                                                        {word}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* 교사용 정답 토글 */}
                                    <div className="mb-3 text-left">
                                        <button onClick={() => toggleAnswerForQ(qIdx)} className="text-xs text-indigo-600 font-bold underline mb-1">
                                            {showAnswerPerQ[qIdx] ? '정답 숨기기' : '🔒 교사용 정답 및 발음 확인'}
                                        </button>
                                        {showAnswerPerQ[qIdx] && (
                                            <p className="text-indigo-700 font-bold japanese-font text-sm whitespace-pre-line bg-indigo-50/80 p-3 rounded-xl border border-indigo-100">
                                                {current.jp}
                                            </p>
                                        )}
                                    </div>

                                    {/* O / △ / X 선택 버튼 */}
                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <button
                                            onClick={() => setMarkForQ(qIdx, 'correct')}
                                            className={`py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border transition-all flex items-center justify-center gap-1.5 ${
                                                currentMark === 'correct'
                                                    ? 'bg-green-500 text-white border-green-600 shadow-md ring-2 ring-green-300'
                                                    : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                                            }`}
                                        >
                                            <i className="fa-solid fa-circle-check"></i> O (정답 1점)
                                        </button>
                                        <button
                                            onClick={() => setMarkForQ(qIdx, 'partial')}
                                            className={`py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border transition-all flex items-center justify-center gap-1.5 ${
                                                currentMark === 'partial'
                                                    ? 'bg-amber-500 text-white border-amber-600 shadow-md ring-2 ring-amber-300'
                                                    : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                                            }`}
                                        >
                                            <i className="fa-solid fa-triangle-exclamation"></i> △ (부분 0.5점)
                                        </button>
                                        <button
                                            onClick={() => setMarkForQ(qIdx, 'wrong')}
                                            className={`py-2.5 rounded-xl font-extrabold text-xs sm:text-sm border transition-all flex items-center justify-center gap-1.5 ${
                                                currentMark === 'wrong'
                                                    ? 'bg-red-500 text-white border-red-600 shadow-md ring-2 ring-red-300'
                                                    : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                                            }`}
                                        >
                                            <i className="fa-solid fa-circle-xmark"></i> X (오답 0점)
                                        </button>
                                    </div>

                                    {/* 학생 개별 발음 녹음 */}
                                    <div className="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 mb-3 flex flex-col items-center gap-2">
                                        <div className="flex justify-between items-center w-full">
                                            <span className="text-xs font-bold text-indigo-900">
                                                <i className="fa-solid fa-microphone text-indigo-500 mr-1"></i> 학생 개별 발음 녹음
                                            </span>
                                            {recordingQIdx === qIdx ? (
                                                <button onClick={stopRecording} className="bg-red-600 text-white font-bold px-3 py-1 rounded-lg text-xs animate-pulse">
                                                    <i className="fa-solid fa-stop mr-1"></i> 녹음 중단
                                                </button>
                                            ) : (
                                                <button onClick={() => startRecording(qIdx)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1 rounded-lg text-xs shadow-sm">
                                                    <i className="fa-solid fa-microphone mr-1"></i> 녹음 시작
                                                </button>
                                            )}
                                        </div>
                                        {recordingsPerQ[qIdx]?.audioUrl && (
                                            <audio controls src={recordingsPerQ[qIdx].audioUrl} className="w-full h-8 mt-1" />
                                        )}
                                    </div>

                                    {/* 손글씨 피드백 작성 캔버스 */}
                                    <HandwritingCanvas
                                        value={feedbackPerQ[qIdx]}
                                        onChange={(dataUrl) => handleFeedbackChange(qIdx, dataUrl)}
                                    />
                                </div>
                            );
                        })}
                    </div>

                    {/* 하단 최종 제출 버튼 */}
                    <div className="mt-8 pt-4 border-t sticky bottom-4 bg-white/90 backdrop-blur p-4 rounded-2xl shadow-xl border z-20">
                        <div className="flex justify-between items-center mb-3">
                            <span className="text-sm font-bold text-gray-700">최종 채점 합계:</span>
                            <span className="text-2xl font-black text-indigo-600">{totalScore} / {testQuestions.length} 점</span>
                        </div>
                        <button
                            onClick={handleSaveAll}
                            disabled={isSaving}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl text-lg shadow-lg transition-all flex items-center justify-center gap-2"
                        >
                            <i className="fa-solid fa-cloud-arrow-up"></i>
                            {isSaving ? '구글 시트로 저장 중...' : '전체 채점 완료 및 구글 시트 저장'}
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('home');
            const [studentData, setStudentData] = useState({});
            const [testScores, setTestScores] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState('');
            const [testQuestions, setTestQuestions] = useState([]);

            const refreshData = async () => {
                if (!GAS_URL || GAS_URL.includes("여기에")) return;
                setIsLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?action=getData`);
                    const data = await res.json();
                    if (data.studentData) setStudentData(data.studentData);
                    if (data.testScores) setTestScores(data.testScores);
                } catch (e) {
                    console.log("동기화 실패", e);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { refreshData(); }, []);

            return (
                <div className="min-h-screen bg-gray-100 py-6 px-4 flex justify-center">
                    <div className="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 border min-h-[85vh]">
                        {screen === 'home' && <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />}
                        {screen === 'practice' && <PracticeScreen setScreen={setScreen} />}
                        {screen === 'student-submit' && <StudentSubmitScreen setScreen={setScreen} refreshData={refreshData} />}
                        {screen === 'teacher-login' && <TeacherLoginScreen setScreen={setScreen} />}
                        {screen === 'teacher-dashboard' && <TeacherDashboardScreen setScreen={setScreen} studentData={studentData} testScores={testScores} setSelectedStudent={setSelectedStudent} setTestQuestions={setTestQuestions} />}
                        {screen === 'test-run' && <TestRunScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} refreshData={refreshData} />}
                        {screen === 'student-display' && <StudentDisplayScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
