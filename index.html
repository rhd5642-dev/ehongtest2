        function StudentSubmitScreen({ setScreen, refreshData }) {
            const [studentClass, setStudentClass] = useState('a8반');
            const [studentId, setStudentId] = useState('');
            const [studentName, setStudentName] = useState('');
            const [sentences, setSentences] = useState([{ ko: '' }, { ko: '' }, { ko: '' }, { ko: '' }]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!studentId || !studentName) return alert("학번과 이름을 입력해주세요.");
                for (let s of sentences) {
                    if (!s.ko.trim()) return alert("4개 문장을 모두 입력해주세요.");
                }

                setIsSubmitting(true);
                const payload = {
                    action: 'submitStory',
                    data: { studentClass, studentId, studentName, sentences }
                };

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    alert("구글 시트로 정상 제출되었습니다!");
                    refreshData();
                    setScreen('home');
                } catch (err) {

                                <input type="text" placeholder="홍길동" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full border rounded-lg p-2.5 font-bold" />

                        <div className="flex flex-col gap-3 mt-2">

                                <input key={idx} type="text" 
                                    placeholder={`문장${idx + 1}- ○○로/는/가 무엇 만들어?- ○○로/는/가 ☆☆ 만들어`} 
                                    value={s.ko} 
                                    onChange={e => {
                                        const newS = [...sentences];

        function TeacherDashboardScreen({ setScreen, studentData, testScores, setSelectedStudent, setTestQuestions }) {
            const [selectedClass, setSelectedClass] = useState('a8반');
            const [activeTab, setActiveTab] = useState('status');
            const [searchTerm, setSearchTerm] = useState('');

            const sortedSubmittedKeys = Object.keys(studentData).sort((a, b) => 
                a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );

            const classSubmitted = sortedSubmittedKeys.filter(key => 
                key.startsWith(selectedClass) &&
                (searchTerm.trim() === '' || key.toLowerCase().includes(searchTerm.toLowerCase().trim()))
            );

            const sortedEvaluatedKeys = Object.keys(testScores)
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }))
                .filter(key => 
                    key.startsWith(selectedClass) &&
                    (searchTerm.trim() === '' || key.toLowerCase().includes(searchTerm.toLowerCase().trim()))
                );

            const generateQuestions = (studentKey) => {
                let seed = 0;
                for (let i = 0; i < studentKey.length; i++) {
                    seed = studentKey.charCodeAt(i) + ((seed << 5) - seed);
                }
                
                const seededRandom = () => {
                    const x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                };

                const shuffledStd = [...standardSentences]
                    .map(item => ({ item, sortVal: seededRandom() }))
                    .sort((a, b) => a.sortVal - b.sortVal)
                    .map(obj => obj.item);

                const selectedStd = shuffledStd.slice(0, 4).map((q, idx) => ({
                    type: `기본 동화 문장 ${idx + 1}`,
                    q_ko: q.q_ko,
                    a_ko: q.a_ko,
                    q_jp: q.q_jp,
                    a_jp: q.a_jp,
                    ko: `질문: ${q.q_ko}\n답변: ${q.a_ko}`,
                    jp: `[질문] ${q.q_jp}\n[답변] ${q.a_jp}`
                }));

                const storyQ = (studentData[studentKey] || []).slice(0, 4).map((s, idx) => ({
                    type: `창작 동화 문장 ${idx + 1}`,
                    ko: s.ko,
                    jp: '학생 제출 문장에 맞춘 회화 표현'
                }));

                return [...selectedStd, ...storyQ];
            };

            const startTest = (studentKey) => {
                setSelectedStudent(studentKey);
                const qList = generateQuestions(studentKey);
                setTestQuestions(qList);
                setScreen('test-run');
            };

            const openStudentDisplay = (studentKey) => {
                setSelectedStudent(studentKey);
                const qList = generateQuestions(studentKey);
                setTestQuestions(qList);
                setScreen('student-display');
            };

            return (
                <div className="max-w-2xl mx-auto py-4">
                    <div className="flex justify-between items-center mb-4">
                        <button onClick={() => setScreen('home')} className="text-gray-600 font-bold"><i className="fa-solid fa-arrow-left"></i> 홈으로</button>
                        <h2 className="text-xl font-bold">교사 관리 대시보드</h2>
                        <div></div>
                    </div>

                    <div className="flex bg-gray-200 rounded-lg p-1 mb-4">
                        <button onClick={() => setActiveTab('status')} className={`flex-1 py-2 font-bold rounded-md ${activeTab === 'status' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>제출 & 평가 진행</button>
                        <button onClick={() => setActiveTab('results')} className={`flex-1 py-2 font-bold rounded-md ${activeTab === 'results' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}`}>채점 결과 & 녹음 확인</button>
                    </div>

                    <div className="flex gap-2 mb-3 overflow-x-auto pb-1">
                        {CLASS_OPTIONS.map(c => (
                            <button key={c} onClick={() => setSelectedClass(c)} className={`px-4 py-1.5 rounded-full font-bold text-sm ${selectedClass === c ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                                {c}
                            </button>
                        ))}
                    </div>

                    <div className="relative mb-4">
                        <input 
                            type="text" 
                            placeholder="학번 또는 이름 검색..." 
                            value={searchTerm} 
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full pl-9 pr-8 py-2 border rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                        />
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                        {searchTerm && (
                            <button onClick={() => setSearchTerm('')} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 text-xs">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        )}
                    </div>

                    {activeTab === 'status' ? (
                        <div className="bg-white rounded-xl border divide-y">
                            {classSubmitted.length > 0 ? classSubmitted.map((stKey, idx) => {
                                const isEvaluated = !!testScores[stKey];
                                return (
                                    <div key={idx} className="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <p className="font-bold text-gray-800">{stKey}</p>
                                            <span className={`text-xs px-2 py-0.5 rounded font-bold ${isEvaluated ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                {isEvaluated ? `채점완료 (${testScores[stKey].score} / 8점)` : '채점 대기중 (8셋트)'}
                                            </span>
                                        </div>
                                        <div className="flex gap-2 w-full sm:w-auto">
                                            <button onClick={() => startTest(stKey)} className="flex-1 sm:flex-none bg-indigo-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow hover:bg-indigo-700">
                                                {isEvaluated ? '재채점' : '평가 시작 (채점용)'}
                                            </button>
                                            <button onClick={() => openStudentDisplay(stKey)} className="flex-1 sm:flex-none bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
                                                📱 학생용 (태블릿)
                                            </button>
                                        </div>
                                    </div>
                                );
                            }) : (
                                <p className="p-8 text-center text-gray-400 font-bold">{selectedClass} 검색결과 또는 제출 학생이 없습니다.</p>
                            )}
                        </div>
                    ) : (
                        <div className="flex flex-col gap-4">
                            {sortedEvaluatedKeys.length > 0 ? sortedEvaluatedKeys.map((stKey, idx) => {
                                const res = testScores[stKey];
                                return (
                                    <div key={idx} className="bg-white p-4 rounded-xl border shadow-sm">
                                        <div className="flex justify-between items-center mb-3 border-b pb-2">
                                            <h3 className="font-bold text-lg text-gray-800">{stKey}</h3>
                                            <span className="text-xl font-black text-indigo-600">{res.score} / 8 점</span>
                                        </div>
                                        <div className="space-y-3">
                                            {(res.details || []).map((item, qIdx) => (
                                                <div key={qIdx} className={`p-3 rounded-lg text-xs font-bold border ${item.isCorrect ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                                                    <div className="flex justify-between items-start">
                                                        <span className="whitespace-pre-line leading-relaxed text-sm">셋트 {qIdx+1}.\n{item.ko}</span>
                                                        <span className={`shrink-0 ml-2 px-2 py-0.5 rounded text-[11px] font-black ${item.isCorrect ? 'bg-green-600 text-white' : 'bg-red-500 text-white'}`}>
                                                            {item.isCorrect ? 'O 정답' : 'X 오답'}
                                                        </span>
                                                    </div>

                                                    {item.wrongWords && item.wrongWords.length > 0 && (
                                                        <div className="mt-2 pt-2 border-t border-red-200 text-red-600 flex items-center gap-1.5 flex-wrap">
                                                            <span className="bg-red-200 text-red-800 px-1.5 py-0.5 rounded text-[10px] font-black">틀린 단어</span>
                                                            {item.wrongWords.map((w, wI) => (
                                                                <span key={wI} className="bg-red-100 text-red-700 px-1.5 py-0.5 rounded line-through">{w}</span>
                                                            ))}
                                                        </div>
                                                    )}

                                                    {item.audioDataUrl ? (
                                                        <div className="mt-2 pt-2 border-t border-gray-200">
                                                            <p className="text-[11px] text-indigo-700 font-bold mb-1 flex items-center gap-1">
                                                                <i className="fa-solid fa-microphone text-indigo-500"></i> 녹음된 학생 발음 재생:
                                                            </p>
                                                            <audio controls src={item.audioDataUrl} className="w-full h-8 rounded" />
                                                        </div>
                                                    ) : (
                                                        <p className="text-[10px] text-gray-400 mt-1 italic">🎙️ 녹음 데이터 없음</p>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            }) : (
                                <p className="p-8 text-center text-gray-400 font-bold bg-white rounded-xl border">채점 결과가 없습니다.</p>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function StudentDisplayScreen({ setScreen, testQuestions, studentName }) {
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(20);

            useEffect(() => {
                const handleMessage = (event) => {
                    if (event.data && event.data.type === 'CHANGE_QUESTION_INDEX') {
                        setIdx(event.data.index);
                    }
                };
                syncChannel.addEventListener('message', handleMessage);
                return () => syncChannel.removeEventListener('message', handleMessage);
            }, []);

            // 문항 변경 시 20초 타이머 리셋
            useEffect(() => {
                setTimeLeft(20);
            }, [idx]);

            // 20초 카운트다운 & 0초 초과 시 자동 다음 문항 이동
            useEffect(() => {
                if (timeLeft <= 0) {
                    if (idx < testQuestions.length - 1) {
                        const nextIdx = idx + 1;
                        setIdx(nextIdx);
                        syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: nextIdx });
                    }
                    return;
                }

                const timer = setInterval(() => {
                    setTimeLeft(prev => prev - 1);
                }, 1000);

                return () => clearInterval(timer);
            }, [timeLeft, idx, testQuestions.length]);

            const current = testQuestions[idx];

            if (!current) {
                return (
                    <div className="py-12 text-center font-bold text-gray-500">
                        질문을 불러오는 중입니다...
                        <div className="mt-4">
                            <button onClick={() => setScreen('teacher-dashboard')} className="bg-gray-200 px-4 py-2 rounded-lg text-sm">대시보드로 돌아가기</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto py-6 flex flex-col justify-between min-h-[75vh]">
                    {/* 상단 바 (대시보드 / 학생이름 / 대형 20초 스톱워치 / 셋트 카운터) */}
                    <div className="flex justify-between items-center border-b pb-4 mb-4">
                        <button onClick={() => setScreen('teacher-dashboard')} className="text-gray-500 font-bold text-sm">
                            <i className="fa-solid fa-arrow-left mr-1"></i> 대시보드
                        </button>
                        <span className="font-extrabold text-teal-700 text-lg">{studentName} 질문 제시 화면</span>
                        <div className="flex items-center gap-2">
                            {/* 강조된 20초 대형 스톱워치 */}
                            <span className={`px-4 py-1.5 rounded-full font-black flex items-center gap-1.5 transition-all border ${
                                timeLeft <= 5 ? 'bg-red-500 text-white border-red-600 animate-pulse' : 'bg-amber-100 text-amber-900 border-amber-300'
                            }`}>
                                <i className="fa-solid fa-stopwatch text-xl"></i>
                                <span className="text-3xl font-black leading-none">{timeLeft}</span>
                                <span className="text-xs font-bold">초</span>
                            </span>
                            <span className="bg-teal-100 text-teal-800 font-black text-sm px-3 py-1 rounded-full">
                                셋트 {idx + 1} / {testQuestions.length}
                            </span>
                        </div>
                    </div>

                    {/* 질문 내용 카드 */}
                    <div className="my-auto py-12 px-6 bg-teal-50/60 rounded-3xl border-2 border-teal-100 text-center shadow-sm">
                        <span className="text-xs font-bold bg-white text-teal-700 px-3 py-1 rounded-full border border-teal-200">
                            {current.type}
                        </span>
                        
                        <div className="mt-8 text-2xl sm:text-3xl font-black text-gray-800 leading-relaxed whitespace-pre-line">
                            {current.ko}
                        </div>
                    </div>

                    {/* 하단 탐색 버튼 (이전 문제 / 다음 문제) */}
                    <div className="flex justify-between items-center gap-4 pt-6 border-t mt-4">
                        <button 
                            disabled={idx === 0} 
                            onClick={() => {
                                const newIdx = idx - 1;
                                setIdx(newIdx);
                                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: newIdx });
                            }} 
                            className="flex-1 bg-gray-200 hover:bg-gray-300 disabled:opacity-30 text-gray-800 font-bold py-4 rounded-xl text-lg transition-all flex items-center justify-center gap-2"
                        >
                            <i className="fa-solid fa-chevron-left"></i> 이전 문제
                        </button>
                        <button 
                            disabled={idx === testQuestions.length - 1} 
                            onClick={() => {
                                const newIdx = idx + 1;
                                setIdx(newIdx);
                                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: newIdx });
                            }} 
                            className="flex-1 bg-teal-600 hover:bg-teal-700 disabled:opacity-30 text-white font-bold py-4 rounded-xl text-lg shadow-md transition-all flex items-center justify-center gap-2"
                        >
                            다음 문제 <i className="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function TestRunScreen({ setScreen, testQuestions, studentName, refreshData }) {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [audioBase64, setAudioBase64] = useState(null);
            const [testDetails, setTestDetails] = useState([]);
            const [wrongWordIndices, setWrongWordIndices] = useState([]);
            const [isMarking, setIsMarking] = useState(false);

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const current = testQuestions[idx];

            const changeQuestionIndex = (newIdx) => {
                setIdx(newIdx);
                syncChannel.postMessage({ type: 'CHANGE_QUESTION_INDEX', index: newIdx });
            };

            const toggleWord = (wordIdx) => {
                if (wrongWordIndices.includes(wordIdx)) {
                    setWrongWordIndices(wrongWordIndices.filter(i => i !== wordIdx));
                } else {
                    setWrongWordIndices([...wrongWordIndices, wordIdx]);
                }
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    let mimeType = 'audio/webm;codecs=opus';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'audio/mp4';
                    }

                    mediaRecorderRef.current = new MediaRecorder(stream, { mimeType });
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => audioChunksRef.current.push(e.data);
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
                        setAudioUrl(URL.createObjectURL(audioBlob));
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => setAudioBase64(reader.result);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    alert("마이크 권한이 필요합니다.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const handleMark = async (isCorrect) => {
                if (isMarking) return;
                setIsMarking(true);

                if (testDetails.length >= testQuestions.length) {
                    setIsMarking(false);
                    return;
                }

                const words = splitTextWithParticles(current.ko);
                const markedWrongWords = wrongWordIndices.map(i => words[i]);

                const currentRecord = {
                    ko: current.ko,
                    jp: current.jp,
                    isCorrect: isCorrect,
                    wrongWords: markedWrongWords,
                    audioDataUrl: audioBase64
                };
                const updatedDetails = [...testDetails, currentRecord];
                setTestDetails(updatedDetails);

                const nextScore = isCorrect ? score + 1 : score;
                setScore(nextScore);

                setAudioUrl(null);
                setAudioBase64(null);
                setShowAnswer(false);
                setWrongWordIndices([]);

                if (updatedDetails.length < testQuestions.length) {
                    changeQuestionIndex(updatedDetails.length);
                    setTimeout(() => setIsMarking(false), 200);
                } else {
                    const payload = {
                        action: 'saveScore',
                        data: { studentName, score: nextScore, details: updatedDetails }
                    };

                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert(`평가 완료! 녹음 파일 및 채점 내역이 구글 드라이브와 시트에 저장되었습니다. (최종 점수: ${nextScore} / ${testQuestions.length}점)`);
                    } catch(e) {
                        alert("구글 시트 저장 중 에러가 발생했습니다.");
                    }
                    refreshData();
                    setIsMarking(false);
                    setScreen('teacher-dashboard');
                }
            };

            const wordList = splitTextWithParticles(current.ko);

            return (
                <div className="max-w-lg mx-auto py-6 text-center">
                    <div className="flex justify-between items-center mb-4">
                        <span className="font-bold text-gray-600">{studentName} 평가 중 (채점 전용)</span>
                        <span className="font-bold text-indigo-600">셋트 {idx + 1} / {testQuestions.length}</span>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border shadow-sm mb-6">
                        <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full">{current.type}</span>
                        
                        <p className="text-xs text-gray-400 font-bold mt-4 mb-2 text-left">
                            💡 틀린 단어 또는 조사를 클릭하면 빨간색 취소선으로 표시됩니다.
                        </p>

                        <div className="flex flex-wrap gap-2 my-2 text-left bg-gray-50 p-4 rounded-xl leading-relaxed">
                            {wordList.map((word, wIdx) => {
                                const isWrong = wrongWordIndices.includes(wIdx);
                                return (
                                    <button
                                        key={wIdx}
                                        type="button"
                                        onClick={() => toggleWord(wIdx)}
                                        className={`px-3 py-1.5 rounded-lg font-bold text-base border transition-all cursor-pointer ${
                                            isWrong
                                                ? 'bg-red-500 text-white border-red-600 line-through shadow-inner'
                                                : 'bg-white text-gray-800 border-gray-300 hover:bg-gray-100 shadow-sm'
                                        }`}
                                    >
                                        {word}
                                    </button>
                                );
                            })}
                        </div>

                        <button onClick={() => setShowAnswer(!showAnswer)} className="text-xs text-indigo-600 font-bold underline mb-2 mt-4">
                            {showAnswer ? '정답 숨기기' : '🔒 교사용 정답 및 발음 확인'}
                        </button>
                        {showAnswer && <p className="text-indigo-600 font-bold japanese-font text-base whitespace-pre-line text-left bg-indigo-50 p-4 rounded-xl border border-indigo-100">{current.jp}</p>}
                    </div>

                    <div className="bg-indigo-50 p-4 rounded-xl border mb-6 flex flex-col items-center gap-3">
                        <p className="text-xs font-bold text-indigo-800">학생 발음 녹음</p>
                        <div className="flex gap-2">
                            {!isRecording ? (
                                <button onClick={startRecording} className="bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
                                    <i className="fa-solid fa-microphone mr-1"></i> 녹음 시작
                                </button>
                            ) : (
                                <button onClick={stopRecording} className="bg-gray-800 text-white font-bold px-4 py-2 rounded-lg text-sm animate-pulse">
                                    <i className="fa-solid fa-stop mr-1"></i> 녹음 중단
                                </button>
                            )}
                        </div>
                        {audioUrl && <audio controls src={audioUrl} className="w-full mt-2 h-8" />}
                    </div>

                    <div className="flex gap-4">
                        <button 
                            onClick={() => handleMark(false)} 
                            disabled={isMarking} 
                            className="flex-1 bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white font-bold py-5 rounded-xl text-2xl transition-all"
                        >
                            X (오답)
                        </button>
                        <button 
                            onClick={() => handleMark(true)} 
                            disabled={isMarking} 
                            className="flex-1 bg-green-500 hover:bg-green-600 disabled:opacity-50 text-white font-bold py-5 rounded-xl text-2xl transition-all"
                        >
                            O (정답)
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('home');
            const [studentData, setStudentData] = useState({});
            const [testScores, setTestScores] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState('');
            const [testQuestions, setTestQuestions] = useState([]);

            const refreshData = async () => {
                if (!GAS_URL || GAS_URL.includes("여기에")) return;
                setIsLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?action=getData`);
                    const data = await res.json();
                    if (data.studentData) setStudentData(data.studentData);
                    if (data.testScores) setTestScores(data.testScores);
                } catch (e) {
                    console.log("동기화 실패", e);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { refreshData(); }, []);

            return (
                <div className="min-h-screen bg-gray-100 py-6 px-4 flex justify-center">
                    <div className="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 border min-h-[85vh]">
                        {screen === 'home' && <HomeScreen setScreen={setScreen} refreshData={refreshData} isLoading={isLoading} />}
                        {screen === 'practice' && <PracticeScreen setScreen={setScreen} />}
                        {screen === 'student-submit' && <StudentSubmitScreen setScreen={setScreen} refreshData={refreshData} />}
                        {screen === 'teacher-login' && <TeacherLoginScreen setScreen={setScreen} />}
                        {screen === 'teacher-dashboard' && <TeacherDashboardScreen setScreen={setScreen} studentData={studentData} testScores={testScores} setSelectedStudent={setSelectedStudent} setTestQuestions={setTestQuestions} />}
                        {screen === 'test-run' && <TestRunScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} refreshData={refreshData} />}
                        {screen === 'student-display' && <StudentDisplayScreen setScreen={setScreen} testQuestions={testQuestions} studentName={selectedStudent} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
